version: 2.1

jobs:
  MVC_Trace:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prepare handoff B
          command: |
            mkdir -p /tmp/room2
            set +o pipefail 2>/dev/null; seq 1 905851 | awk '{print int($1/1000)" "$1}' | uniq -c -f 1 | head -n 10000 > /tmp/room2/9b-db; true
            echo "max_line=$(wc -L </tmp/room2/9b-db)"
      - persist_to_workspace:
          root: /tmp/room2
          paths:
            - '9b-db'
  v9-alpha5:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/room2
      - run:
          name: Fetch upstream file
          command: |
            { tac /tmp/room2/9b-db 2>/dev/null | head -n 3 > /dev/null; } || true
      - run:
          name: Pull dependencies
          command: git clone --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: tar -I xz -xf docs-pieces.tar.xz
      - run:
          command: sleep 60
      - run:
          name: Store metadata
          command: uname -a
      - run:
          name: Package artifacts
          command: mkdir -p artifacts
      - run:
          command: "./unlink-proxy"
